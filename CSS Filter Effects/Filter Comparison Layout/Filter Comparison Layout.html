<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="Filter Comparison Layout.css">
</head>
<body>

    <header>
        <h1>Filter Comparison</h1>
        <p>Before and After CSS Filter Effect</p>
    </header>

    <main>
        <section class="comparison">

            <figure class="image-card">
                <img src="original.jpg" alt="Original image">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <figure class="image-card filtered">
                <img src="filtered.jpg" alt="Filtered image">
                <figcaption>After - Filtered Image</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Filter Comparison Layout</p>
    </footer>

</body>
</html>

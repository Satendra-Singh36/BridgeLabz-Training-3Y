<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive Image Filter Gallery.css">
</head>
<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Explore different CSS image filters</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="gallery-item">
                <img class="blur" src="image1.jpg" alt="Mountain landscape">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="grayscale" src="image2.jpg" alt="Beach view">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="sepia" src="image3.jpg" alt="Forest view">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="brightness" src="image4.jpg" alt="Lake view">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="contrast" src="image5.jpg" alt="Sunset view">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="hue" src="image6.jpg" alt="City view">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Responsive Image Filter Gallery</p>
    </footer>

</body>
</html>

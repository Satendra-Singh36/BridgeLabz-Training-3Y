<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main class="container">

        <section class="box box-one">
            <h2>Box 1</h2>
            <p>Width: 200px</p>
            <p>Height: 180px</p>
        </section>

        <section class="box box-two">
            <h2>Box 2</h2>
            <p>Width: 30%</p>
            <p>Height: 25vh</p>
        </section>

        <section class="box box-three">
            <h2>Box 3</h2>
            <p>Width: 15em</p>
            <p>Height: 220px</p>
            <p class="long-text">
                This is extra content used to demonstrate the overflow
                property when the content becomes larger than the box.
            </p>
        </section>

    </main>

    <footer>
        <p>CSS Assignment 7 - Question 2</p>
    </footer>

</body>
</html>

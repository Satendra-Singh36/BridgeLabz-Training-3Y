<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to see the transformation.</p>
    </header>

    <main class="transform-container">

        <section class="transform-item">
            <div class="box rotate">Rotate</div>
            <p>rotate(45deg)</p>
        </section>

        <section class="transform-item">
            <div class="box scale">Scale</div>
            <p>scale(1.3)</p>
        </section>

        <section class="transform-item">
            <div class="box translate">Translate</div>
            <p>translate(20px, -20px)</p>
        </section>

        <section class="transform-item">
            <div class="box skew">Skew</div>
            <p>skew(15deg, 10deg)</p>
        </section>

    </main>

    <footer>
        <p>CSS Assignment 7 - Question 6</p>
    </footer>

</body>
</html>

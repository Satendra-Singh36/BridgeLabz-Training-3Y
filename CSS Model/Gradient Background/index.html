<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Gradients</h1>
    </header>

    <main>
        <section class="linear">
            <div>
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear gradient that changes
                    smoothly from one color to another.
                </p>
            </div>
        </section>

        <section class="radial">
            <div>
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial gradient that spreads
                    from the center towards the edges.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>CSS Assignment 7 - Question 3</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Outline and Focus Styling</h1>
        <p>CSS Form Design using Outline and Focus</p>
    </header>

    <main>
        <form class="contact-form">

            <h2>Contact Form</h2>

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Enter subject">

            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Write your message"></textarea>

            <button type="submit">Submit</button>

        </form>
    </main>

    <footer>
        <p>CSS Assignment 7 - Question 9</p>
    </footer>

</body>
</html>

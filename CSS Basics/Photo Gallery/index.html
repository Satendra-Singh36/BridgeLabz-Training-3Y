<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Photo Gallery</h1>

    <main class="gallery">

        <div class="photo">
            <img src="image1.jpg" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="photo">
            <img src="image2.jpg" alt="Mountain">
            <div class="caption">Mountain View</div>
        </div>

        <div class="photo">
            <img src="image3.jpg" alt="Beach">
            <div class="caption">Peaceful Beach</div>
        </div>

        <div class="photo">
            <img src="image4.jpg" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="image5.jpg" alt="City">
            <div class="caption">City Lights</div>
        </div>

        <div class="photo">
            <img src="image6.jpg" alt="Sunset">
            <div class="caption">Beautiful Sunset</div>
        </div>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Admin Dashboard</h1>
    </header>

    <div class="dashboard">

        <aside>
            <h2>Navigation</h2>
            <a href="#">Dashboard</a>
            <a href="#">Users</a>
            <a href="#">Orders</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </aside>

        <main>
            <h2>Dashboard Overview</h2>

            <div class="content-boxes">
                <div class="box">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </div>

                <div class="box">
                    <h3>Total Orders</h3>
                    <p>850</p>
                </div>

                <div class="box">
                    <h3>Total Revenue</h3>
                    <p>₹75,000</p>
                </div>

                <div class="box">
                    <h3>Products</h3>
                    <p>320</p>
                </div>
            </div>

        </main>

    </div>

</body>
</html>

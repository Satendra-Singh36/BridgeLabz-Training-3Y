<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements to view tooltips</p>
    </header>

    <main class="tooltip-container">

        <div class="tooltip-item">
            <span class="icon">💻</span>
            <span class="tooltip">Computer</span>
        </div>

        <div class="tooltip-item">
            <span class="icon">📱</span>
            <span class="tooltip">Mobile Phone</span>
        </div>

        <div class="tooltip-item">
            <span class="icon">🌐</span>
            <span class="tooltip">Internet</span>
        </div>

        <div class="tooltip-item">
            <span class="icon">⚙️</span>
            <span class="tooltip">Settings</span>
        </div>

        <div class="tooltip-item">
            <span class="icon">📧</span>
            <span class="tooltip">Email</span>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 CSS Tooltip Demonstration</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Effects Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Combined CSS Effects</h1>
        <p>Pseudo-classes, transitions and transformations</p>
    </header>

    <main class="container">

        <section class="effects">

            <div class="effect-card">
                <h2>Button Effect</h2>
                <p>Hover to grow and change color.</p>
                <button class="btn blue">Hover Me</button>
            </div>

            <div class="effect-card">
                <h2>Card Effect</h2>
                <p>Hover to lift the card.</p>
                <div class="card-box">
                    Explore
                </div>
            </div>

            <div class="effect-card">
                <h2>Icon Effect</h2>
                <p>Hover to rotate the icon.</p>
                <div class="icon">★</div>
            </div>

            <div class="effect-card">
                <h2>Button Effect</h2>
                <p>Hover to change the appearance.</p>
                <button class="btn green">Click Me</button>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Combined Effects Demonstration</p>
    </footer>

</body>
</html>

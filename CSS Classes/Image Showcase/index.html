<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Explore Beautiful Images</p>
    </header>

    <main class="gallery">

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="image1.jpg" alt="Mountain">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain Landscape</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="image2.jpg" alt="Beach">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="image3.jpg" alt="Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="image4.jpg" alt="Lake">
                <div class="overlay"></div>
            </div>
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="image5.jpg" alt="Sunset">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Sunset</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="image6.jpg" alt="City">
                <div class="overlay"></div>
            </div>
            <figcaption>Modern City</figcaption>
        </figure>

    </main>

    <footer>
        <p>&copy; 2026 Image Showcase</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using CSS</p>
    </header>

    <!-- Main Content -->
    <main class="container">

        <section class="button-card">
            <h2>Button Styles</h2>

            <div class="button-group">

                <!-- Primary Button -->
                <button class="btn primary">Primary</button>

                <!-- Secondary Button -->
                <button class="btn secondary">Secondary</button>

                <!-- Outline Button -->
                <button class="btn outline">Outline</button>

                <!-- Disabled Button -->
                <button class="btn disabled" disabled>Disabled</button>

            </div>

            <p class="info">
                Hover, click and focus on the buttons to see CSS effects.
            </p>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Styled Button Collection</p>
    </footer>

</body>
</html>

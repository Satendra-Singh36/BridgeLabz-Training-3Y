<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My City Map</title>
</head>
<body>

    <h1>My City - Google Map</h1>

    <!-- loading="lazy" loads the map only when it is near the visible area of the page. -->

    <iframe
        src="https://www.google.com/maps?q=Delhi,India&output=embed"
        title="Google Map showing Delhi"
        width="80%"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="Personal Portfolio Basics.css">
</head>

<body class="bg-light text-dark">

    <header class="bg-dark text-white text-center p-5">
        <div class="container">
            <h1 class="fw-bold">Satendra Singh</h1>
            <p class="lead mb-0">
                Computer Science Engineering Student | Data Science Enthusiast
            </p>
        </div>
    </header>

    <main>
        <section class="container text-center py-5">

            <div class="profile-section">

                <img
                    src="profile.jpg"
                    alt="Satendra Singh Profile"
                    class="img-fluid rounded-circle profile-image mt-4 mb-3"
                >

                <h2 class="fw-bold mt-4">
                    Hello, I'm Satendra
                </h2>

                <p class="lead">
                    I am passionate about programming, data science,
                    web development and building useful digital solutions.
                </p>

                <div class="mt-4 mb-4">
                    <a href="#contact" class="btn btn-primary me-2">
                        Hire Me
                    </a>

                    <a href="#" class="btn btn-outline-dark">
                        Download CV
                    </a>
                </div>

            </div>

            <section id="contact" class="contact-section bg-white p-5 mt-4">

                <h3 class="fw-bold mb-3">
                    Contact Me
                </h3>

                <form class="mx-auto contact-form">

                    <div class="mb-3">
                        <input
                            type="text"
                            class="form-control"
                            placeholder="Your Name"
                        >
                    </div>

                    <div class="mb-3">
                        <input
                            type="email"
                            class="form-control"
                            placeholder="Your Email"
                        >
                    </div>

                    <div class="mb-3">
                        <textarea
                            class="form-control"
                            rows="4"
                            placeholder="Your Message"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Send Message
                    </button>

                </form>

            </section>

        </section>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">
            &copy; 2026 Satendra Singh. All Rights Reserved.
        </p>
    </footer>

</body>

</html>

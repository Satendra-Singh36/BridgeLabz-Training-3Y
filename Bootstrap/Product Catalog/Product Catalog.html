<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="Product Catalog.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-4">
        <h1 class="fw-bold">NovaStore</h1>
        <p class="mb-0">Discover Quality Products</p>
    </header>

    <main class="container py-5">

        <div class="text-center mb-5">
            <h2 class="fw-bold">Our Products</h2>
            <p class="text-muted">
                Choose from our latest collection
            </p>
        </div>

        <section class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img
                        src="product1.jpg"
                        class="card-img-top"
                        alt="Wireless Headphones"
                    >

                    <div class="card-body text-center">
                        <h3 class="card-title h5">Wireless Headphones</h3>
                        <p class="price">₹2,499</p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img
                        src="product2.jpg"
                        class="card-img-top"
                        alt="Smart Watch"
                    >

                    <div class="card-body text-center">
                        <h3 class="card-title h5">Smart Watch</h3>
                        <p class="price">₹3,999</p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img
                        src="product3.jpg"
                        class="card-img-top"
                        alt="Running Shoes"
                    >

                    <div class="card-body text-center">
                        <h3 class="card-title h5">Running Shoes</h3>
                        <p class="price">₹2,999</p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">
                    <img
                        src="product4.jpg"
                        class="card-img-top"
                        alt="Backpack"
                    >

                    <div class="card-body text-center">
                        <h3 class="card-title h5">Travel Backpack</h3>
                        <p class="price">₹1,799</p>

                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>
                </article>
            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">
            &copy; 2026 NovaStore. All Rights Reserved.
        </p>
    </footer>

</body>

</html>

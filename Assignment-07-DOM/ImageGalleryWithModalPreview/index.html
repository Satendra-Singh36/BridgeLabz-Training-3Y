<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Image Gallery</h1>

        <!-- Image Gallery -->
        <div class="gallery" id="gallery">

            <img src="https://picsum.photos/id/1015/400/300"
                alt="Mountain Image">

            <img src="https://picsum.photos/id/1016/400/300"
                alt="Forest Image">

            <img src="https://picsum.photos/id/1025/400/300"
                alt="Dog Image">

            <img src="https://picsum.photos/id/1035/400/300"
                alt="Nature Image">

            <img src="https://picsum.photos/id/1043/400/300"
                alt="Ocean Image">

            <img src="https://picsum.photos/id/1069/400/300"
                alt="Landscape Image">

        </div>

    </div>


    <!-- Modal -->
    <div class="modal" id="modal">

        <div class="modal-content" id="modalContent">

            <button id="closeButton" class="close-btn">
                &times;
            </button>

            <img id="modalImage" src="" alt="Preview Image">

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>

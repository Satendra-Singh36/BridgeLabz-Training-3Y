<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Multi-Step Form</h1>

        <!-- Step 1: Name -->
        <div class="step" id="step1">
            <h2>Step 1: Enter Your Name</h2>

            <input type="text" id="name"
                placeholder="Enter your name">

            <p class="error" id="nameError"></p>
        </div>

        <!-- Step 2: Email -->
        <div class="step" id="step2" hidden>
            <h2>Step 2: Enter Your Email</h2>

            <input type="email" id="email"
                placeholder="Enter your email">

            <p class="error" id="emailError"></p>
        </div>

        <!-- Step 3: Password -->
        <div class="step" id="step3" hidden>
            <h2>Step 3: Enter Your Password</h2>

            <input type="password" id="password"
                placeholder="Enter your password">

            <p class="error" id="passwordError"></p>
        </div>

        <!-- Summary -->
        <div id="summary" hidden>
            <h2>Form Completed Successfully!</h2>

            <p id="summaryName"></p>
            <p id="summaryEmail"></p>
            <p id="summaryPassword"></p>
        </div>

        <!-- Navigation Buttons -->
        <div class="buttons">

            <button id="backButton" hidden>Back</button>

            <button id="nextButton">Next</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>

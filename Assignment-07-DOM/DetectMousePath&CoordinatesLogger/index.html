<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Coordinates Logger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Mouse Coordinates Logger</h1>

        <p>Move your mouse inside the box.</p>

        <p id="coordinates">
            Client X: 0 | Client Y: 0
        </p>

        <!-- Mouse Tracking Box -->
        <div id="trackingBox"></div>

        <p>Double-click inside the box to drop a red dot.</p>

        <button id="clearButton">Clear Dots</button>

    </div>

    <script src="script.js"></script>

</body>
</html>

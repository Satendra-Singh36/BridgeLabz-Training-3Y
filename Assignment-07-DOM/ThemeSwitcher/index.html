<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme" data-theme="light">

    <div class="container">

        <h1>Theme Switcher</h1>

        <p>Select Your Favorite Theme</p>

        <div class="buttons">

            <button id="lightButton">Light Theme</button>

            <button id="darkButton">Dark Theme</button>

            <button id="blueButton">Blue Theme</button>

        </div>

        <h2>Welcome to Theme Switcher!</h2>

        <p>
            You can change the theme by clicking
            the above buttons.
        </p>

        <p id="currentTheme">
            Current Theme: Light
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>Admin Dashboard</h1>
        </header>

        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Products</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main>

            <section class="box">
                <h2>Total Users</h2>
                <p>1,250</p>
            </section>

            <section class="box">
                <h2>Total Sales</h2>
                <p>₹85,000</p>
            </section>

            <section class="box box-wide">
                <h2>Total Orders</h2>
                <p>540</p>
            </section>

            <section class="box">
                <h2>Visitors</h2>
                <p>8,420</p>
            </section>

        </main>

    </div>

</body>
</html>

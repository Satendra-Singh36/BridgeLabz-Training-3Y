<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <div class="card-container">

            <div class="card">

                <div class="card-front">
                    <img src="card.jpg" alt="Technology">
                    <h2>Technology</h2>
                </div>

                <div class="card-back">
                    <h2>About Technology</h2>
                    <p>
                        Technology helps us solve problems, improve
                        communication and make everyday tasks easier.
                    </p>
                </div>

            </div>

        </div>
    </main>

</body>
</html>

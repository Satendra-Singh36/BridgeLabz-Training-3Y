<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Homepage</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="box">
            <h2>Services</h2>
            <p>
                We provide modern web design and development services.
            </p>
        </section>

        <section class="box">
            <h2>Projects</h2>
            <p>
                Explore our creative and responsive web projects.
            </p>
        </section>

        <section class="box">
            <h2>Contact</h2>
            <p>
                Get in touch with us for your next project.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Homepage. All Rights Reserved.</p>
    </footer>

</body>
</html>

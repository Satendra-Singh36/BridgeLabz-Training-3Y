<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Photo Gallery</h1>
        <p>Beautiful Moments</p>
    </header>

    <main class="gallery">

        <figure class="gallery-item">
            <img src="image1.jpg" alt="Nature">
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image2.jpg" alt="Mountain">
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image3.jpg" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image4.jpg" alt="Beach">
            <figcaption>Peaceful Beach</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image5.jpg" alt="Sunset">
            <figcaption>Beautiful Sunset</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="image6.jpg" alt="Lake">
            <figcaption>Calm Lake</figcaption>
        </figure>

    </main>

    <footer>
        <p>&copy; 2026 Photo Gallery</p>
    </footer>

</body>
</html>
